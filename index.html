<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortcut Web Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e; /* Warna background gelap keren */
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 600px;
            justify-content: center;
        }
        /* Desain Kotak Shortcut */
        .shortcut-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            background: #2b2b3d;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .shortcut-card:hover {
            transform: translateY(-5px);
            background: #3b3b52;
        }
        .shortcut-card img {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .shortcut-card span {
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Shortcut YouTube -->
    <a href="https://www.youtube.com" target="_blank" class="shortcut-card">
        <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube">
        <span>YouTube</span>
    </a>

    <!-- 2. Shortcut Google -->
    <a href="https://www.google.com" target="_blank" class="shortcut-card">
        <img src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="Google">
        <span>Google</span>
    </a>

    <!-- 3. Shortcut Spotify -->
    <a href="https://open.spotify.com" target="_blank" class="shortcut-card">
        <img src="https://www.google.com/s2/favicons?domain=spotify.com&sz=64" alt="Spotify">
        <span>Spotify</span>
    </a>

    <!-- 4. Shortcut Canva -->
    <a href="https://www.canva.com" target="_blank" class="shortcut-card">
        <img src="https://www.google.com/s2/favicons?domain=canva.com&sz=64" alt="Canva">
        <span>Canva</span>
    </a>

    <!-- KALAU MAU NAMBAH LAGI, TINGGAL PASTE DI SINI -->

</div>

</body>
</html>
